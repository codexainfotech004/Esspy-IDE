<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#080810"/>
  <!-- IC chip body -->
  <rect x="8" y="8" width="16" height="16" rx="2" fill="none" stroke="#00979C" stroke-width="1.5"/>
  <!-- Inner die -->
  <rect x="12" y="12" width="8" height="8" rx="1" fill="#00979C" fill-opacity="0.25" stroke="#00979C" stroke-width="0.8"/>
  <!-- Pins top -->
  <line x1="11" y1="5" x2="11" y2="8" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="5" x2="16" y2="8" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="5" x2="21" y2="8" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins bottom -->
  <line x1="11" y1="24" x2="11" y2="27" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="24" x2="16" y2="27" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="24" x2="21" y2="27" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins left -->
  <line x1="5" y1="11" x2="8" y2="11" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5" y1="16" x2="8" y2="16" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5" y1="21" x2="8" y2="21" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins right -->
  <line x1="24" y1="11" x2="27" y2="11" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="16" x2="27" y2="16" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="21" x2="27" y2="21" stroke="#00979C" stroke-width="1.5" stroke-linecap="round"/>
</svg>
